<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the CSS pads
         it back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101438" />
    <meta
      name="description"
      content="Messages between Nimiq wallets, with spam priced out instead of guessed at."
    />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Nimiq Pay reads this for the app's name and description. It does NOT
         read the icons in it, and it does not read the icon links above.

         For the icon it probes two root paths directly — /favicon.ico and
         /icon.svg — identifying itself by appending "Nimiq Pay" to the WebView
         user agent. Nothing in this repo links to /icon.svg, so it looks unused
         to a grep and to a bundler. Deleting it is what put a default globe in
         the app once already, and the 404 that would have said so never came:
         an unknown path is answered with this file, so the host got 200 and a
         page of HTML where it expected an image.

         None of this is documented — nimiq.dev/mini-apps covers deeplinks,
         providers and permissions, and says nothing about icons. It was found
         by logging what the host asked the dev server for. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Knock</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      // A module cannot do this — by the time one loads, the wrong theme has
      // already been on screen — so the choice is read here and lib/theme.ts
      // takes over from there. The storage key is the one thing the two have to
      // agree on; keep them in step.
      try {
        var chosen = localStorage.getItem("knock.theme")
      } catch (error) {
        // Private mode, or storage turned off. Nothing was ever chosen.
      }
      var dark =
        chosen === "dark" ||
        (chosen !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.classList.toggle("dark", dark)
      document.documentElement.style.colorScheme = dark ? "dark" : "light"
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
