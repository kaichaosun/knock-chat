<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch; the CSS pads
         it back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101438" />
    <meta
      name="description"
      content="Messages between Nimiq wallets, with spam priced out instead of guessed at."
    />

    <!-- The card Discord, X, Slack, WhatsApp and iMessage draw when somebody
         shares a link to this. Without these they have a URL and nothing else,
         which is what a link to Knock used to look like anywhere it was posted.

         Written here, in the HTML, rather than anywhere in the app: a crawler
         asks for the page and reads what comes back. It does not run the
         bundle, so nothing React sets would ever be seen.

         Absolute, not `/og.png`. A relative URL works in some readers and is
         simply dropped by others — X among them — and there is no way to tell
         which happened from the outside. The cost of hard-coding the host is
         one line to change if it ever moves; the cost of the alternative is a
         card that silently has no picture on half the internet.

         And a caution this repo has already paid for once: an unknown path
         here is answered with this file, so a wrong image path is not a 404. A
         crawler asks for a picture, gets 200 and a page of HTML, and shows no
         image — exactly the symptom of having no tags at all. If a card comes
         back empty, check what /og.png actually returns before touching
         anything else. Same trap as /icon.svg below.

         Both vocabularies are needed. X reads its own `twitter:` tags first
         and falls back to Open Graph; Discord and the rest read Open Graph.
         `summary_large_image` is what makes X draw the wide card rather than a
         thumbnail beside the text. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Knock" />
    <meta property="og:url" content="https://knockchat.org/" />
    <meta property="og:title" content="Knock - chat on Nimiq" />
    <meta
      property="og:description"
      content="Messages between Nimiq wallets, with spam priced out instead of guessed at."
    />
    <meta property="og:image" content="https://knockchat.org/og.png" />
    <!-- Stated so the card is laid out on the first request, before the image
         itself has been fetched and measured. -->
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Knock - messages between Nimiq wallets, with spam priced out instead of guessed at."
    />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Knock - chat on Nimiq" />
    <meta
      name="twitter:description"
      content="Messages between Nimiq wallets, with spam priced out instead of guessed at."
    />
    <meta name="twitter:image" content="https://knockchat.org/og.png" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Nimiq Pay reads this for the app's name and description. It does NOT
         read the icons in it, and it does not read the icon links above.

         For the icon it probes two root paths directly — /favicon.ico and
         /icon.svg — identifying itself by appending "Nimiq Pay" to the WebView
         user agent. Nothing in this repo links to /icon.svg, so it looks unused
         to a grep and to a bundler. Deleting it is what put a default globe in
         the app once already, and the 404 that would have said so never came:
         an unknown path is answered with this file, so the host got 200 and a
         page of HTML where it expected an image.

         None of this is documented — nimiq.dev/mini-apps covers deeplinks,
         providers and permissions, and says nothing about icons. It was found
         by logging what the host asked the dev server for. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Knock - chat on Nimiq</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      // A module cannot do this — by the time one loads, the wrong theme has
      // already been on screen — so the choice is read here and lib/theme.ts
      // takes over from there. The storage key is the one thing the two have to
      // agree on; keep them in step.
      try {
        var chosen = localStorage.getItem("knock.theme")
      } catch (error) {
        // Private mode, or storage turned off. Nothing was ever chosen.
      }
      var dark =
        chosen === "dark" ||
        (chosen !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.classList.toggle("dark", dark)
      document.documentElement.style.colorScheme = dark ? "dark" : "light"
    </script>

    <!-- Analytics. Our own swa instance rather than somebody's service, which
         is what makes it tellable in a privacy policy: it records the path, the
         referrer, browser and operating system by name, the screen size, and a
         visitor number re-derived from the browser and the date every day. No
         cookie, and no IP address kept. It never sees a Nimiq address, so
         nothing it collects can be tied back to an account.

         It is a script from another origin, so it runs with everything this
         page has — the device key in storage included. That is a trust
         decision, not an oversight: the origin is ours and is effectively part
         of the app. Anything else pointed at here would have the same reach.

         lib/legal.ts tells the user exactly what is collected, and they agree
         to it. Changing what is sent means changing that document too. -->
    <script defer data-api="https://swa-monitor.movedone.ai" src="https://swa-monitor.movedone.ai/tracker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
