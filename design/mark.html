     og.html, which explains why it is drawn this big. 1600x1544 keeps the
     SVG's own 227x219 proportion. -->

<style>
  * { margin: 0; padding: 0 }
  html, body { width: 1600px; height: 1544px }
  img { width: 1600px; display: block }
</style>
